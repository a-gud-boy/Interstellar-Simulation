app-id: io.github.a_gud_boy.InterstellarDesktop
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: interstellar-desktop
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-pictures:create
modules:
  - name: interstellar-desktop
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/interstellar-desktop/cargo
    build-commands:
      - cargo build --release --offline --manifest-path desktop/Cargo.toml
      - install -Dm755 desktop/target/release/interstellar-desktop /app/bin/interstellar-desktop
      - install -Dm644 packaging/linux/io.github.a_gud_boy.InterstellarDesktop.desktop /app/share/applications/io.github.a_gud_boy.InterstellarDesktop.desktop
      - install -Dm644 packaging/linux/io.github.a_gud_boy.InterstellarDesktop.metainfo.xml /app/share/metainfo/io.github.a_gud_boy.InterstellarDesktop.metainfo.xml
      - install -Dm644 shared/assets/app-icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.a_gud_boy.InterstellarDesktop.png
      - install -Dm644 shared/assets/app-icon.svg /app/share/icons/hicolor/scalable/apps/io.github.a_gud_boy.InterstellarDesktop.svg
    sources:
      - type: git
        url: https://github.com/a-gud-boy/Interstellar-Simulation.git
        tag: v0.1.4.2-beta
