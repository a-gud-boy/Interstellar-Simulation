[package]
name = "interstellar-desktop"
version = "0.1.2-beta"
edition = "2024"
description = "Native Linux (cross-platform ready) 1:1 Rust + wgpu clone of the Interstellar Relativistic Simulation Suite"

[lib]
name = "interstellar_desktop"
path = "src/lib.rs"

[[bin]]
name = "interstellar-desktop"
path = "src/main.rs"

[dependencies]
wgpu = "30.0"
winit = "0.30.13"
egui = "0.37.0"
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
glam = "0.34"
bytemuck = { version = "1.25", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pollster = "1.0"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
