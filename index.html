<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Interstellar Spacetime Simulators — Gargantua, Wormhole, Binary BH, Warp Drive, Supernova, Pulsar &amp; Starflight</title>
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305060a'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%23f0b35a' stroke-width='3' opacity='0.9'/%3E%3Cellipse cx='32' cy='32' rx='28' ry='7' transform='rotate(-14 32 32)' fill='none' stroke='%23f7ca82' stroke-width='2.6'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23000'/%3E%3C/svg%3E"
  />
  <noscript>
    <meta http-equiv="refresh" content="0; url=./blackhole-sim/" />
  </noscript>
  <script type="module">
    import { SIMULATORS, resolveSimByAlias } from './shared/simRegistry.js';

    function renderHubCards(qs) {
      const nav = document.getElementById('hub-cards');
      if (!nav) return;
      nav.textContent = '';
      for (const sim of SIMULATORS) {
        const a = document.createElement('a');
        a.className = sim.cardClass ? `card ${sim.cardClass}` : 'card';
        a.href = `./${sim.dir}/${qs ? `?${qs}` : ''}`;

        const title = document.createElement('span');
        title.className = 'card-title';
        title.textContent = sim.title;

        const desc = document.createElement('span');
        desc.className = 'card-desc';
        desc.textContent = sim.description;

        a.append(title, desc);
        nav.appendChild(a);
      }
    }

    try {
      const params = new URLSearchParams(window.location.search || '');
      const showHub = params.has('hub');
      const simParam = params.get('sim') || '';
      const target = resolveSimByAlias(simParam);
      params.delete('sim');
      params.delete('hub');
      const qs = params.toString();

      if (showHub) {
        renderHubCards(qs);
      } else {
        window.location.replace(`./${target.dir}/${qs ? `?${qs}` : ''}`);
      }
    } catch {
      renderHubCards('');
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #03050a;
      --surface: rgba(12, 16, 26, 0.84);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #f0b35a;
      --accent-teal: #5eead4;
      --accent-violet: #a78bfa;
      --accent-cyan: #38bdf8;
      --accent-nebula: #fb923c;
      --accent-pulsar: #67e8f9;
      --accent-starflight: #60a5fa;
      --text: #eef2f7;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at 50% 30%, #0d1424 0%, var(--bg) 70%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .hub {
      width: min(820px, 100%);
      padding: 28px;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.25rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    p.sub {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }
    a.card {
      display: block;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: inherit;
      text-decoration: none;
      transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
    }
    a.card:hover,
    a.card:focus-visible {
      border-color: var(--accent);
      background: rgba(240, 179, 90, 0.08);
      transform: translateY(-1px);
      outline: none;
    }
    a.card.wormhole:hover,
    a.card.wormhole:focus-visible {
      border-color: var(--accent-teal);
      background: rgba(94, 234, 212, 0.08);
    }
    a.card.binary:hover,
    a.card.binary:focus-visible {
      border-color: var(--accent-violet);
      background: rgba(167, 139, 250, 0.08);
    }
    a.card.warp:hover,
    a.card.warp:focus-visible {
      border-color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.08);
    }
    a.card.supernova:hover,
    a.card.supernova:focus-visible {
      border-color: var(--accent-nebula);
      background: rgba(251, 146, 60, 0.08);
    }
    a.card.pulsar:hover,
    a.card.pulsar:focus-visible {
      border-color: var(--accent-pulsar);
      background: rgba(103, 232, 249, 0.08);
    }
    a.card.starflight:hover,
    a.card.starflight:focus-visible {
      border-color: var(--accent-starflight);
      background: rgba(96, 165, 250, 0.08);
    }
    .card-title {
      display: block;
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 6px;
      color: var(--accent);
    }
    .card.wormhole .card-title { color: var(--accent-teal); }
    .card.binary .card-title { color: var(--accent-violet); }
    .card.warp .card-title { color: var(--accent-cyan); }
    .card.supernova .card-title { color: var(--accent-nebula); }
    .card.pulsar .card-title { color: var(--accent-pulsar); }
    .card.starflight .card-title { color: var(--accent-starflight); }
    .card-desc {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="hub">
    <h1>Interstellar Spacetime Simulators</h1>
    <p class="sub">Choose a relativistic GPU ray-tracer below:</p>
    <nav id="hub-cards" class="cards" aria-label="Available spacetime simulators">
      <noscript>
        <a class="card" href="./blackhole-sim/">
          <span class="card-title">Gargantua — Kerr Black Hole</span>
          <span class="card-desc">Enable JavaScript to launch any of the 7 WebGL2/WebGPU spacetime simulators.</span>
        </a>
      </noscript>
    </nav>
  </main>
</body>
</html>
