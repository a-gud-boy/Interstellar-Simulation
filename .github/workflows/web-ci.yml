name: Web Physics & Shader Verification

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "home/**"
      - "shared/**"
      - "scripts/**"
      - "packaging/**"
      - "sims/**"
      - "desktop/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "home/**"
      - "shared/**"
      - "scripts/**"
      - "packaging/**"
      - "sims/**"
      - "desktop/**"
      - ".github/workflows/web-ci.yml"

jobs:
  physics-check:
    name: Shared & 9-Sim Physics Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify unified metadata registry
        run: node scripts/sync-metadata.mjs --check

      - name: Verify single-source WGSL wrappers
        run: node scripts/sync-wgsl.mjs --check

      - name: Verify desktop packaging manifests
        run: node scripts/render-packaging.mjs --check

      - name: Check Service Worker syntax
        run: node --check sw.js

      - name: Run shared & simulator physics checks
        run: node scripts/run-tests.mjs --physics

  rust-check:
    name: Desktop Rust Parity, Shaders, Clippy & Fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Vulkan software ICD (Lavapipe) for headless wgpu validation
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml -- --check

      - name: Run Clippy lints
        run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets -- -D warnings

      - name: Run desktop physics parity & WGSL shader validation
        run: cargo test --manifest-path desktop/Cargo.toml --test physics_parity --test shader_validation
