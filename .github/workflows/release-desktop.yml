name: Release Desktop (Linux & Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - desktop/**
      - home/previews/**
      - packaging/**
      - scripts/render-packaging.mjs
      - shared/assets/milkyway_4k.jpg
      - shared/assets/app-icon*
      - shared/sims.json
      - shared/shaders/*.wgsl
      - "sims/*/src/shaders/*.wgsl"
      - .github/workflows/release-desktop.yml
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify packaging manifests match Cargo.toml version
        run: node scripts/render-packaging.mjs --check

      - name: Install Vulkan software ICD (Lavapipe) for headless wgpu validation
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libfuse2t64 || sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers

      - name: Run deterministic physics parity & WGSL shader validation tests
        run: cargo test --manifest-path desktop/Cargo.toml --test physics_parity --test shader_validation

      - name: Build Linux release binary
        run: cargo build --release --manifest-path desktop/Cargo.toml

      - name: Package Linux release tarball & AppImage
        run: |
          mkdir -p desktop/target/release-bundle
          tar -czf desktop/target/release-bundle/Interstellar-linux-x86_64.tar.gz \
            -C desktop/target/release interstellar-desktop
          chmod +x packaging/linux/build-appimage.sh
          ./packaging/linux/build-appimage.sh --dir-only
          curl -fsSL -o /tmp/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool-x86_64.AppImage
          APPIMAGETOOL=/tmp/appimagetool-x86_64.AppImage ./packaging/linux/build-appimage.sh

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: interstellar-desktop-linux-x86_64
          path: |
            desktop/target/release-bundle/Interstellar-linux-x86_64.tar.gz
            desktop/target/release-bundle/Interstellar-linux-x86_64.AppImage
          if-no-files-found: error

      - name: Publish Linux bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            desktop/target/release-bundle/Interstellar-linux-x86_64.tar.gz
            desktop/target/release-bundle/Interstellar-linux-x86_64.AppImage

  build-windows:
    name: Build Windows (x86_64 MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain & Windows MSVC target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Run deterministic physics parity & WGSL shader validation tests
        run: cargo test --manifest-path desktop/Cargo.toml --test physics_parity --test shader_validation

      - name: Build Windows MSVC release binary
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --target x86_64-pc-windows-msvc --manifest-path desktop/Cargo.toml

      - name: Package Windows release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/target/release-bundle | Out-Null
          Compress-Archive `
            -Path desktop/target/x86_64-pc-windows-msvc/release/interstellar-desktop.exe `
            -DestinationPath desktop/target/release-bundle/Interstellar-windows-x86_64.zip `
            -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: interstellar-desktop-windows-x86_64
          path: desktop/target/release-bundle/Interstellar-windows-x86_64.zip
          if-no-files-found: error

      - name: Publish Windows bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: desktop/target/release-bundle/Interstellar-windows-x86_64.zip
