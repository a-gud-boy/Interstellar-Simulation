name: Build macOS Desktop

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Target macOS architecture
        required: false
        default: universal
        type: choice
        options:
          - universal
          - arm64
          - x86_64
  push:
    branches:
      - main
    paths:
      - desktop/**
      - home/previews/**
      - shared/assets/milkyway_4k.jpg
      - shared/sims.json
      - shared/shaders/*.wgsl
      - "sims/*/src/shaders/*.wgsl"
      - .github/workflows/build-macos.yml
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ inputs.arch || 'universal' }})
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain & Apple targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo dependencies & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Run deterministic physics parity & WGSL shader validation tests
        run: cargo test --manifest-path desktop/Cargo.toml --test physics_parity --test shader_validation

      - name: Build and package Interstellar.app (.zip + .dmg)
        run: |
          chmod +x desktop/build-macos.sh
          ./desktop/build-macos.sh --"${{ inputs.arch || 'universal' }}"

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interstellar-desktop-macos-${{ inputs.arch || 'universal' }}
          path: |
            desktop/target/macos-bundle/*.dmg
            desktop/target/macos-bundle/*.zip
          if-no-files-found: error

      - name: Publish macOS bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            desktop/target/macos-bundle/*.dmg
            desktop/target/macos-bundle/*.zip
